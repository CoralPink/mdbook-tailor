# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: true

tone_instructions: >-
  Focus on actionable correctness issues.
  Avoid speculative refactors, unnecessary defensive code,
  and outdated compatibility workarounds.
  Do not duplicate checks enforced by project tooling.

reviews:
  tools:
    stylelint:
      enabled: false
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: true
  review_status: false
  collapse_walkthrough: false
  auto_review:
    enabled: false
    drafts: false
    ignore_usernames: ["renovate[bot]"]

chat:
  auto_reply: true
